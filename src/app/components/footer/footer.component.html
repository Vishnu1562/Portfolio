<footer class="border-t border-slate-900 bg-slate-950 py-8 px-4 sm:px-6 lg:px-8">
  <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-400">
    <div class="flex items-center gap-2">
      <span class="font-bold text-slate-200">{{ store.personalInfo().name }}</span>
      <span>&bull;</span>
      <span>Crafted with Angular & Tailwind CSS</span>
    </div>
    <div class="flex items-center gap-4">
      <a href="#about" class="hover:text-cyan-400 transition-colors">Top</a>
      <a [href]="store.personalInfo().github" target="_blank" rel="noopener noreferrer" class="hover:text-cyan-400 transition-colors">GitHub</a>
      <a [href]="store.personalInfo().linkedin" target="_blank" rel="noopener noreferrer" class="hover:text-cyan-400 transition-colors">LinkedIn</a>
    </div>
  </div>
</footer>
