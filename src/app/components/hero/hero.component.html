<section id="about" class="relative pt-20 pb-28 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
  <div class="flex flex-col items-start gap-6 max-w-4xl">
    <!-- Headline & Role -->
    <div class="space-y-3">
      <span class="text-sm font-mono uppercase tracking-wider text-cyan-400 font-semibold block">
        Hello World, I'm
      </span>
      <h1 class="text-4xl sm:text-6xl lg:text-7xl font-extrabold tracking-tight text-white leading-[1.1]">
        {{ store.personalInfo().name }}
      </h1>
      <h2 class="text-2xl sm:text-3xl font-semibold bg-gradient-to-r from-slate-200 via-indigo-200 to-cyan-400 bg-clip-text text-transparent">
        {{ store.personalInfo().headline }}
      </h2>
    </div>

    <!-- Bio Paragraph -->
    <p class="text-base sm:text-lg text-slate-300 leading-relaxed max-w-3xl">
      {{ store.personalInfo().bio }}
    </p>

    <!-- Key Tech Stack Quick Badges -->
    <div class="flex flex-wrap items-center gap-2 pt-1 font-mono text-xs">
      <span class="text-slate-400">Core:</span>
      <span class="px-2.5 py-1 rounded-md bg-slate-900 border border-slate-800 text-slate-200">NestJS</span>
      <span class="px-2.5 py-1 rounded-md bg-slate-900 border border-slate-800 text-slate-200">TypeScript</span>
      <span class="px-2.5 py-1 rounded-md bg-slate-900 border border-slate-800 text-slate-200">Node.js</span>
      <span class="px-2.5 py-1 rounded-md bg-slate-900 border border-slate-800 text-slate-200">ASP.NET Core</span>
      <span class="px-2.5 py-1 rounded-md bg-slate-900 border border-slate-800 text-slate-200">PostgreSQL</span>
      <span class="px-2.5 py-1 rounded-md bg-slate-900 border border-slate-800 text-slate-200">IDE Extensions</span>
      <span class="px-2.5 py-1 rounded-md bg-slate-900 border border-slate-800 text-slate-200">Angular</span>
    </div>

    <!-- CTAs & Socials -->
    <div class="flex flex-wrap items-center gap-4 pt-4">
      <a
        href="#projects"
        class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-gradient-to-r from-indigo-500 to-cyan-500 hover:from-indigo-600 hover:to-cyan-600 text-white font-medium text-sm transition-all shadow-lg shadow-indigo-500/25 group"
      >
        <span>View Projects</span>
        <svg class="w-4 h-4 group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
        </svg>
      </a>

      <a
        href="#contact"
        class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-slate-900 hover:bg-slate-850 text-slate-200 font-medium text-sm border border-slate-800 hover:border-slate-700 transition-all"
      >
        <span>Contact Me</span>
      </a>
    </div>
  </div>
</section>
