<header class="sticky top-0 z-50 w-full backdrop-blur-xl bg-slate-950/80 border-b border-slate-800/80 transition-all duration-300">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
    <!-- Brand / Logo -->
    <a href="#about" class="flex items-center gap-2 group">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 via-indigo-600 to-cyan-400 p-[1px] shadow-sm shadow-indigo-500/20">
        <div class="w-full h-full bg-slate-950 rounded-[11px] flex items-center justify-center group-hover:bg-slate-900 transition-colors">
          <span class="font-mono font-bold text-cyan-400 text-sm">VV</span>
        </div>
      </div>
      <div class="flex flex-col">
        <span class="font-semibold text-slate-100 text-sm tracking-tight group-hover:text-cyan-400 transition-colors">{{ store.personalInfo().name }}</span>
        <span class="text-[10px] text-slate-400 font-mono -mt-1">{{ store.personalInfo().headline }}</span>
      </div>
    </a>

    <!-- Desktop Nav Links -->
    <nav class="hidden md:flex items-center gap-1 text-sm font-medium text-slate-300">
      <a href="#about" class="px-3 py-1.5 rounded-lg hover:text-cyan-400 hover:bg-slate-900/60 transition-all">About</a>
      <a href="#experience" class="px-3 py-1.5 rounded-lg hover:text-cyan-400 hover:bg-slate-900/60 transition-all">Experience</a>
      <a href="#skills" class="px-3 py-1.5 rounded-lg hover:text-cyan-400 hover:bg-slate-900/60 transition-all">Skills</a>
      <a href="#projects" class="px-3 py-1.5 rounded-lg hover:text-cyan-400 hover:bg-slate-900/60 transition-all">Projects</a>
      <a href="#contact" class="px-3 py-1.5 rounded-lg hover:text-cyan-400 hover:bg-slate-900/60 transition-all">Contact</a>
    </nav>

    <!-- Header Actions -->
    <div class="hidden md:flex items-center gap-3">
      <button
        type="button"
        (click)="store.openResumeModal()"
        class="inline-flex items-center gap-2 px-3.5 py-1.5 text-xs font-semibold rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-200 border border-slate-700/80 hover:border-cyan-500/40 transition-all shadow-sm"
      >
        <svg class="w-3.5 h-3.5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg>
        <span>Resume</span>
      </button>
      <a
        href="#contact"
        class="inline-flex items-center gap-1.5 px-3.5 py-1.5 text-xs font-semibold rounded-lg bg-gradient-to-r from-indigo-500 to-cyan-500 hover:from-indigo-600 hover:to-cyan-600 text-white transition-all shadow-md shadow-indigo-500/20"
      >
        Hire Me
      </a>
    </div>

    <!-- Mobile Hamburger Button -->
    <div class="flex md:hidden">
      <button
        type="button"
        (click)="store.toggleMobileMenu()"
        aria-label="Toggle mobile menu"
        class="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-900 focus:outline-none"
      >
        @if (!store.isMobileMenuOpen()) {
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        } @else {
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        }
      </button>
    </div>
  </div>

  <!-- Mobile Dropdown Drawer -->
  @if (store.isMobileMenuOpen()) {
    <div class="md:hidden border-b border-slate-800 bg-slate-950/95 px-4 pt-2 pb-6 space-y-2 backdrop-blur-2xl">
      <a (click)="store.closeMobileMenu()" href="#about" class="block px-3 py-2 rounded-lg text-base font-medium text-slate-200 hover:text-cyan-400 hover:bg-slate-900">About</a>
      <a (click)="store.closeMobileMenu()" href="#experience" class="block px-3 py-2 rounded-lg text-base font-medium text-slate-200 hover:text-cyan-400 hover:bg-slate-900">Experience</a>
      <a (click)="store.closeMobileMenu()" href="#skills" class="block px-3 py-2 rounded-lg text-base font-medium text-slate-200 hover:text-cyan-400 hover:bg-slate-900">Skills</a>
      <a (click)="store.closeMobileMenu()" href="#projects" class="block px-3 py-2 rounded-lg text-base font-medium text-slate-200 hover:text-cyan-400 hover:bg-slate-900">Projects</a>
      <a (click)="store.closeMobileMenu()" href="#contact" class="block px-3 py-2 rounded-lg text-base font-medium text-slate-200 hover:text-cyan-400 hover:bg-slate-900">Contact</a>
      <div class="pt-3 flex flex-col gap-2">
        <button
          type="button"
          (click)="store.openResumeModal(); store.closeMobileMenu()"
          class="w-full py-2 text-center text-sm font-medium rounded-lg bg-slate-900 text-slate-200 border border-slate-800"
        >
          Download Resume
        </button>
      </div>
    </div>
  }
</header>
